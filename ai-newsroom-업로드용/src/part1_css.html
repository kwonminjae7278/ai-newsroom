<title>나만의 AI 편집국</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face{font-family:"Nanum Pen Script";src:url("assets/NanumPenScript.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Black Han Sans";src:url("assets/BlackHanSans.woff2") format("woff2");font-display:swap}
@font-face{font-family:"Pretendard";src:url("assets/PretendardVariable.woff2") format("woff2-variations"),url("assets/PretendardVariable.woff2") format("woff2");font-weight:45 920;font-style:normal;font-display:swap}
/* Layout: espresso newsroom chrome around a warm illustrated floor map; right rail = the context card (the experiment's subject) */
:root{
  --ink:#F3EADB;          /* primary text on chrome */
  --ink-2:#BFB2A0;        /* secondary text */
  --ink-3:#8C8073;
  --chrome:#1B1714;       /* page */
  --panel:#25201C;        /* rails */
  --panel-2:#2F2924;
  --line:#3E3631;
  --paper:#FBF6EC;        /* context card paper */
  --paper-ink:#2A221C;
  --paper-line:#E6DAC6;
  --chief:#5B7FCB; --reporter:#D98A3D; --pd:#6FA67A; --artist:#B07CC6; --red:#E0524A; --human:#E9C46A;
  --ok:#6FBF7F;
  --f-ui:"Pretendard",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --f-disp:"Pretendard","Apple SD Gothic Neo",sans-serif;
  --f-chalk:"Nanum Pen Script","Gaegu",cursive;
  --f-bubble:"Pretendard","Apple SD Gothic Neo",sans-serif;
  --f-fx:"Black Han Sans","Pretendard",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--chrome);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--human);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;gap:12px;max-width:1720px;margin:0 auto}

/* header */
.top{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-family:var(--f-disp);font-weight:800;font-size:23px;margin:0;letter-spacing:-.6px}
.brand small{color:var(--ink-3);font-size:12px;letter-spacing:.06em}
.steps{display:flex;gap:4px;flex-wrap:wrap;flex:1;min-width:0}
.step{display:flex;align-items:center;gap:6px;padding:5px 10px 5px 6px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--ink-3);font-size:12px;white-space:nowrap;transition:all .3s}
.step b{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--panel-2);font-size:11px;color:var(--ink-2)}
.step.on{color:var(--ink);border-color:var(--human);background:#3A3023}
.step.on b{background:var(--human);color:#2a1f0e}
.step.done{color:var(--ink-2)}
.step.done b{background:var(--ok);color:#10210f}
.modechip{font-size:12px;padding:5px 10px;border-radius:6px;background:var(--panel);border:1px solid var(--line);color:var(--ink-2)}
.modechip.live{border-color:#6FBF7F;color:#BFE9C6}
.speed{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px}
.speed button{background:none;border:0;padding:3px 8px;border-radius:4px;font-size:12px;color:var(--ink-3)}
.speed button.on{background:var(--panel-2);color:var(--ink)}

/* main */
.main{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:12px;min-height:0}
@media (max-width:1100px){.main{grid-template-columns:1fr}}
.stagewrap{position:relative;min-width:0;display:flex;flex-direction:column;gap:8px}
.stage{position:relative;width:100%;aspect-ratio:2400/1340;border-radius:14px;overflow:hidden;background:#140f0c;box-shadow:0 20px 50px rgba(0,0,0,.45);user-select:none;container-type:inline-size}
.stage img.map{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.stage .vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(10,6,3,.35))}
.zone{position:absolute;transform:translate(-50%,-50%);font-size:max(9px,1.05cqw);font-weight:600;letter-spacing:.04em;color:#4b3424;background:rgba(251,246,236,.82);border:1px solid rgba(91,58,36,.25);padding:.15em .6em;border-radius:4px;pointer-events:none;white-space:nowrap}

/* projected surfaces */
.surface{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;overflow:hidden}
.board{width:920px;height:600px;padding:34px 40px;font-family:var(--f-chalk);color:#F2F1E6;text-shadow:0 0 1px rgba(255,255,255,.35)}
.board h4{margin:0 0 6px;font-weight:400;font-size:44px;color:#FFF7C2;letter-spacing:1px}
.board .row{display:flex;gap:14px;align-items:baseline;font-size:34px;line-height:1.08;margin:2px 0;opacity:0;transform:translateX(-12px);transition:all .5s}
.board .row.in{opacity:1;transform:none}
.board .tag{flex:0 0 auto;font-size:26px;padding:0 10px;border:2px solid currentColor;border-radius:8px}
.board .row.theme{color:#DDEBFF}
.board .row.rheme{color:#FFE27A}
.board .row.rheme .txt{text-decoration:underline wavy rgba(255,226,122,.75);text-underline-offset:6px}
.board .cand{margin-top:10px;font-size:34px;color:#FFD3B0;opacity:0;transition:opacity .6s}
.board .cand.in{opacity:1}
.board .chain{font-size:40px;color:#C8F7C5;margin-top:8px;opacity:0;transition:opacity .6s}
.board .chain.in{opacity:1}
.screen{background:#0F1622;color:#DDE8FF;font-family:var(--f-ui)}
.tv{width:520px;height:330px;padding:22px}
.tv h5{margin:0 0 12px;font-size:22px;color:#9FC2FF;font-weight:600}
.tv .opt{display:flex;align-items:center;gap:12px;margin:10px 0;padding:10px 14px;border-radius:10px;background:rgba(255,255,255,.06);font-size:22px;border:2px solid transparent;transition:all .4s}
.tv .opt .bar{flex:1;height:10px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden}
.tv .opt .bar i{display:block;height:100%;width:0;background:#7FB3FF;transition:width 1.2s}
.tv .opt.pick{border-color:var(--human);background:rgba(233,196,106,.16)}
.tv .opt.off{opacity:.45}
.mon{width:460px;height:310px;padding:16px 18px;font-family:ui-monospace,Menlo,monospace}
.mon .lbl{font:600 15px var(--f-ui);color:#8FB4FF;margin-bottom:8px;display:flex;justify-content:space-between}
.mon .prompt{font-size:15px;line-height:1.45;color:#CFE0FF;height:140px;overflow:hidden;white-space:pre-wrap}
.mon .prog{height:8px;border-radius:4px;background:rgba(255,255,255,.1);margin:10px 0;overflow:hidden}
.mon .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7FB3FF,#B07CC6)}
.mon .out{position:absolute;inset:0;display:none;background:#000}
.mon .out.show{display:block}
.cork{width:480px;height:380px;padding:18px;display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.pin{position:relative;background:#fff;padding:6px;box-shadow:0 4px 10px rgba(0,0,0,.35);transform:rotate(-2deg) scale(.6);opacity:0;transition:all .6s cubic-bezier(.2,1.4,.4,1)}
.pin.in{transform:rotate(-2deg) scale(1);opacity:1}
.pin:nth-child(2n){transform:rotate(2deg) scale(.6)}
.pin:nth-child(2n).in{transform:rotate(2deg) scale(1)}
.pin::before{content:"";position:absolute;top:-6px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:#D04A3B;box-shadow:0 2px 2px rgba(0,0,0,.4)}

/* agents */
.agent{position:absolute;height:13%;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer}
.agent .body{height:100%;position:relative}
.agent .fig{height:100%}
.agent:not(.walking) .body{animation:breathe 2.8s ease-in-out infinite;animation-delay:var(--ph,0s);transform-origin:50% 100%}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.018)}}
.agent.talking .fig{animation:hop .5s ease-out}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-5%)}70%{transform:translateY(0)}85%{transform:translateY(-1.5%)}100%{transform:translateY(0)}}
.agent .body img{height:100%;display:block;filter:drop-shadow(0 3px 2px rgba(40,20,5,.35));transform-origin:50% 100%}
.agent.left .body img{transform:scaleX(-1)}
.agent.walking .body{animation:bob .42s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.6deg)}50%{transform:translateY(-4%) rotate(1.6deg)}}
.agent .shadow{position:absolute;left:50%;bottom:-3%;width:70%;height:9%;margin-left:-35%;border-radius:50%;background:rgba(50,25,8,.28);filter:blur(2px)}
.agent .tag{position:absolute;left:50%;bottom:102%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap;pointer-events:none}
.agent .name{font-size:max(9px,.95cqw);font-weight:700;color:#fff;padding:.1em .55em;border-radius:4px;background:var(--c);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.agent .stat{font-size:max(8px,.82cqw);color:#3b2a1d;background:rgba(255,250,240,.92);padding:.05em .5em;border-radius:3px;border:1px solid rgba(0,0,0,.08)}
.agent .stat.busy::before{content:"";display:inline-block;width:.55em;height:.55em;border-radius:50%;background:var(--c);margin-right:.35em;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.say{--sx:0%;position:absolute;left:50%;bottom:calc(100% + max(34px,3.2cqw));transform:translate(calc(-50% + var(--sx)),6px) scale(.9);transform-origin:50% 100%;min-width:max(120px,11cqw);max-width:max(180px,19cqw);background:#fff;color:#22201c;font-size:max(10px,1.05cqw);line-height:1.38;padding:.55em .8em;border-radius:12px;box-shadow:0 6px 16px rgba(0,0,0,.28);opacity:0;transition:all .25s;pointer-events:none;border:2px solid var(--c);white-space:normal;text-align:left;z-index:5}
.say::after{content:"";position:absolute;left:50%;top:100%;margin-left:-7px;border:7px solid transparent;border-top-color:var(--c)}
.say.show{opacity:1;transform:translate(calc(-50% + var(--sx)),0) scale(1)}
.say.sl{--sx:-34%}.say.sr{--sx:34%}
.say.sl::after{left:84%}.say.sr::after{left:16%}
.say.amb{border-style:dashed;background:#FFFDF7;font-size:max(9.5px,.98cqw)}
.agent.chat .stat{display:none}
.say b{color:var(--c)}
.dots i{display:inline-block;width:.42em;height:.42em;margin:0 .1em;border-radius:50%;background:var(--c);animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-35%);opacity:1}}
.carry{position:absolute;left:62%;top:44%;pointer-events:none;transition:opacity .3s}
.ctx-chip{display:flex;flex-direction:column;justify-content:space-between;width:max(30px,3.1cqw);height:max(38px,3.9cqw);padding:.25em .3em;background:var(--paper);border:1px solid #c9b48f;border-radius:3px;box-shadow:2px 3px 0 rgba(60,35,15,.35);font-size:max(7px,.7cqw);color:var(--paper-ink);font-weight:700;transform:rotate(8deg)}
.ctx-chip i{display:block;height:2px;background:#d9c9ac;margin:1px 0}
.ctx-chip span{color:var(--c)}
.thumbs{position:relative;width:max(40px,4.2cqw);height:max(34px,3.4cqw)}
.thumbs div{position:absolute;inset:0;border:2px solid #fff;border-radius:2px;background-size:cover;background-position:center;box-shadow:1px 2px 4px rgba(0,0,0,.4)}
.thumbs div:nth-child(1){transform:rotate(-8deg) translate(-12%,4%)}
.thumbs div:nth-child(2){transform:rotate(-2deg)}
.thumbs div:nth-child(3){transform:rotate(6deg) translate(10%,-4%)}
.memo{background:#FFE7E3;border:1px solid var(--red);color:var(--red);font-size:max(7px,.75cqw);font-weight:800;padding:.2em .4em;transform:rotate(-6deg);box-shadow:1px 2px 0 rgba(0,0,0,.25)}
.paper-fly{position:absolute;z-index:999;width:max(54px,5.6cqw);padding:.4em;background:#fff;border:1px solid #d5cbbb;box-shadow:0 8px 18px rgba(0,0,0,.35);font-size:max(7px,.7cqw);color:#222;transform:translate(-50%,-50%) rotate(-6deg);pointer-events:none}
.paper-fly b{display:block;font-family:var(--f-disp);font-size:1.15em;line-height:1.2;margin-bottom:.3em}
.paper-fly i{display:block;height:2px;background:#ddd;margin:2px 0}

/* floating stage cards */
.float{position:absolute;z-index:900;background:var(--paper);color:var(--paper-ink);border-radius:10px;box-shadow:0 14px 30px rgba(0,0,0,.4);font-size:max(10px,.95cqw);padding:.8em .9em;opacity:0;transform:translateY(8px);transition:all .35s;pointer-events:none;max-width:34cqw}
.float.show{opacity:1;transform:none;pointer-events:auto}
.float h6{margin:0 0 .4em;font-size:1.05em;display:flex;align-items:center;gap:.4em}
.float .li{display:flex;gap:.5em;align-items:flex-start;padding:.3em 0;border-top:1px dashed var(--paper-line);opacity:.15;transition:opacity .4s}
.float .li.in{opacity:1}
.float .v{flex:0 0 auto;font-size:.82em;font-weight:800;padding:.1em .45em;border-radius:4px;color:#fff}
.float .v.pass{background:#4E9A5E}.float .v.fix{background:var(--red)}
.motion{width:30cqw;padding:.5em}
.motion .mv{position:relative;width:100%;aspect-ratio:16/10;overflow:hidden;border-radius:6px;background:#000}
.motion .mv>div{position:absolute;inset:-6%;background-size:cover;background-position:center;animation:kb 6s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translate(0,0)}to{transform:scale(1.12) translate(-3%,-2%)}}
.rec{position:absolute;top:.5em;left:.6em;color:#fff;font-size:.8em;font-weight:700;background:rgba(224,82,74,.9);padding:.05em .45em;border-radius:3px}

/* right rail */
.rail{background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;max-height:calc(100vh - 150px);overflow:hidden}
@media (max-width:1100px){.rail{max-height:none}}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:11px 6px;color:var(--ink-3);font-weight:600;font-size:13px;border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--human)}
.tabpane{flex:1;overflow:auto;padding:14px;min-height:0}
.tabpane[hidden]{display:none}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.cardhead h3{margin:0;font-family:var(--f-disp);font-size:19px}
.cardhead p{margin:2px 0 0;color:var(--ink-3);font-size:12px}
.holder{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line);white-space:nowrap}
.holder i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--hc,#777)}
.vbar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;align-items:end;height:64px;margin:6px 0 4px;padding:0 2px}
.vbar div{position:relative;background:var(--panel-2);border-radius:3px 3px 0 0;height:4%;transition:height .6s}
.vbar div.on{background:var(--human)}
.vbar div span{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);font-size:10px;color:var(--ink-3);white-space:nowrap}
.vlab{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;font-size:10px;color:var(--ink-3);text-align:center;margin-bottom:12px}
.paper{background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:12px 12px 8px;box-shadow:0 1px 0 #d8c9ad, 0 8px 18px rgba(0,0,0,.25);position:relative}
.paper .stamp{position:absolute;top:10px;right:10px;font-family:var(--f-disp);font-size:13px;color:var(--red);border:2px solid var(--red);border-radius:4px;padding:0 6px;transform:rotate(6deg);opacity:.85}
.paper .empty{color:#8a7b68;font-size:13px;padding:16px 4px}
.grp{margin:4px 0 10px}
.grp h4{display:flex;align-items:center;gap:6px;margin:0 0 4px;font-size:12px;color:var(--gc);letter-spacing:.02em}
.grp h4 em{font-style:normal;font-size:10px;padding:0 5px;border-radius:3px;background:var(--gc);color:#fff}
.fld{display:grid;grid-template-columns:86px 1fr;gap:8px;padding:5px 0;border-top:1px dashed var(--paper-line);font-size:12.5px;line-height:1.45}
.fld .k{color:#7a6a57;font-weight:600}
.fld .val{min-width:0;overflow-wrap:anywhere}
.fld.new{animation:flash 2.2s ease-out}
@keyframes flash{0%{background:rgba(233,196,106,.65)}100%{background:transparent}}
.fld .hitl{display:inline-block;font-size:10px;font-weight:700;color:#7a5200;background:#F6E2A8;border-radius:3px;padding:0 4px;margin-left:4px}
.fld img{width:100%;border-radius:4px;display:block;margin-top:4px}
.fld .th{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:4px}
.fld .th div{aspect-ratio:1;border-radius:3px;background-size:cover;background-position:center}
.log{display:flex;flex-direction:column;gap:8px}
.log .it{display:grid;grid-template-columns:auto 1fr;gap:8px;font-size:12.5px}
.log .it .who{font-weight:700;color:var(--lc);white-space:nowrap}
.log .it .tool{display:inline-block;font-size:10.5px;color:#BFE9C6;background:#203527;border:1px solid #2f5a3a;border-radius:3px;padding:0 5px;margin-right:4px;font-family:ui-monospace,Menlo,monospace}
.log .it time{grid-column:1/-1;color:var(--ink-3);font-size:10.5px;margin-top:-6px}
.src{font-size:12.5px;color:var(--ink-2);white-space:pre-wrap;line-height:1.6}
.src h5{margin:0 0 6px;color:var(--ink);font-size:13px}
.team{display:flex;flex-direction:column;gap:8px}
.mate{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;padding:8px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line)}
.mate img{width:44px;height:44px;object-fit:cover;object-position:50% 12%;border-radius:50%;background:#efe3cf}
.mate b{font-size:13px}
.mate p{margin:0;color:var(--ink-3);font-size:12px}

/* dock */
.dock{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.inrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inrow input{flex:1;min-width:220px;background:var(--chrome);border:1px solid var(--line);border-radius:8px;padding:11px 12px;color:var(--ink);font:inherit}
.btn{border:0;border-radius:8px;padding:10px 16px;font-weight:700;background:var(--human);color:#2a1f0e}
.btn.ghost{background:var(--panel-2);color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hint{color:var(--ink-3);font-size:12px;margin-top:6px}
.hint a{color:var(--ink-2)}
textarea{width:100%;min-height:90px;background:var(--chrome);border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--ink);font:inherit;resize:vertical}
.decide h3{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:8px}
.decide h3 .who{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--human);color:#2a1f0e}
.decide p{margin:0 0 10px;color:var(--ink-2);font-size:13px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.choice{text-align:left;background:var(--chrome);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;transition:border-color .2s}
.choice:hover{border-color:var(--human)}
.choice b{font-size:14px}
.choice span{color:var(--ink-2);font-size:12.5px}
.choice small{color:var(--ink-3);font-size:11.5px}
.choice[disabled]{opacity:.5}
.choice .rec{position:static;display:inline-block;width:max-content;background:#3a3023;color:var(--human);font-size:11px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#3a2320;border:1px solid var(--red);color:#ffd9d4;padding:10px 14px;border-radius:10px;z-index:3000;max-width:min(560px,92vw);font-size:13px;display:none}
.toast.show{display:block}

/* popover */
.pop{position:absolute;z-index:1200;width:260px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.5);padding:12px;display:none}
.pop.show{display:block}
.pop .ph{display:flex;gap:10px;align-items:center}
.pop .ph img{width:52px;height:52px;border-radius:50%;object-fit:cover;object-position:50% 10%;background:#efe3cf}
.pop .st{margin-top:8px;font-size:12.5px;color:var(--ink-2)}
.pop .st b{color:var(--ink)}

/* webtoon reader */
